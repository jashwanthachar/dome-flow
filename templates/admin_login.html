<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Municipal administrator sign-in for CivicEye Tumakuru operations, triage oversight, and department dispatch.">
  <title>Admin Portal Login - CivicEye Tumakuru</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="mobile-container" style="justify-content: center; max-width: 440px;">
    <!-- Brand Header -->
    <header class="app-header" style="text-align: center; padding-bottom: 24px;">
      <div class="brand-row" style="justify-content: center;">
        <div class="logo-mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-name">CivicEye</h1>
          <span class="city-tag">Tumakuru</span>
        </div>
      </div>
      <h2 style="font-size: 20px; font-weight: 800; color: #ffffff; margin-top: 8px;">Admin Portal</h2>
      <p style="color: var(--text-muted); font-size: 13.5px; margin-top: 4px;">Municipal Grievance Triage &amp; Department Workflow</p>
    </header>

    <!-- Login Box Card -->
    <main class="admin-login-card">
      {% if error %}
      <div class="alert-error" style="margin-bottom: 18px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/admin/login{% if request.args.get('next') %}?next={{ request.args.get('next')|urlencode }}{% endif %}" method="POST" class="report-form">
        <div class="form-group">
          <label for="password" class="form-label">
            <span>Administrator Password</span>
            <span class="req-star">*</span>
          </label>
          <div class="track-search-input-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              type="password" 
              name="password" 
              id="password" 
              class="track-search-input" 
              placeholder="Enter administrator password..."
              required 
              autofocus
            >
          </div>
        </div>

        <button type="submit" class="btn-submit-report" style="margin-top: 10px;">
          <span>Sign In to Admin Portal</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </button>
      </form>
    </main>

    <footer class="bottom-actions" style="margin-top: 24px; text-align: center;">
      <a href="/" class="placeholder-back-btn" style="justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Return to Citizen Portal</span>
      </a>
      <div class="footer-meta">
        <p>Tumakuru City Corporation &bull; CivicEye Admin</p>
      </div>
    </footer>
  </div>
</body>
</html>
