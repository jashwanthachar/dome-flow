<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="CivicEye Tumakuru municipal citizen grievance portal.">
  <title>{{ title }} - CivicEye Tumakuru</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="mobile-container">
    <header class="app-header">
      <a href="/" class="placeholder-back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back to Home</span>
      </a>
      <div class="brand-row" style="margin-top: 10px;">
        <div class="logo-mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-name">CivicEye</h1>
          <span class="city-tag">Tumakuru</span>
        </div>
      </div>
    </header>

    <main class="placeholder-page">
      <div class="placeholder-card">
        <div class="placeholder-icon">{{ icon }}</div>
        <h2>{{ heading }}</h2>
        <p>{{ message }}</p>
      </div>
    </main>

    <footer class="bottom-actions">
      <a href="/" class="btn-quick-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Return to Categories</span>
      </a>
      <div class="footer-meta">
        <p>Tumakuru City Corporation &bull; CivicEye Portal</p>
      </div>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
