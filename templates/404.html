<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Page not found - CivicEye Tumakuru municipal grievance portal.">
  <title>404 - Page Not Found | CivicEye Tumakuru</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="mobile-container" style="justify-content: center; min-height: 100vh;">
    <!-- Header -->
    <header class="app-header" style="text-align: center; padding-bottom: 16px;">
      <div class="brand-row" style="justify-content: center;">
        <div class="logo-mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-name">CivicEye</h1>
          <span class="city-tag">Tumakuru</span>
        </div>
      </div>
    </header>

    <!-- 404 Error Card -->
    <main class="track-not-found-card" style="margin: 20px 0; padding: 36px 20px;">
      <div class="not-found-icon-wrap" style="width: 72px; height: 72px; font-size: 32px; margin-bottom: 20px;">
        🔍
      </div>
      <div style="font-size: 13px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;">
        Error 404
      </div>
      <h2 class="not-found-title" style="font-size: 24px; margin-bottom: 12px;">Page Not Found</h2>
      <p class="not-found-desc" style="max-width: 320px; margin: 0 auto 24px auto;">
        We could not find the page or grievance you were looking for. It may have been moved, resolved, or typed incorrectly.
      </p>

      <div style="display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin: 0 auto;">
        <a href="/" class="btn-submit-report" style="text-decoration: none; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Return to Home</span>
        </a>
        <a href="/track" class="btn-track-submit" style="text-decoration: none; justify-content: center; background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span>Track Complaint Status</span>
        </a>
        <a href="/dashboard" class="btn-clear-search" style="text-decoration: none; justify-content: center; font-size: 13px; font-weight: 600; color: #94a3b8; padding: 8px 12px; margin-top: 4px;">
          View Public Dashboard &rarr;
        </a>
      </div>
    </main>

    <footer class="app-footer" style="text-align: center; margin-top: 16px;">
      <p style="font-size: 12px; color: #64748b;">
        Tumakuru City Corporation &bull; Municipal Grievance Redressal
      </p>
    </footer>
  </div>
</body>
</html>
