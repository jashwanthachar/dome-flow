services:
  - type: web
    name: civiceye
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        sync: false
      - key: DEBUG_TOKEN
        value: civiceye123
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
